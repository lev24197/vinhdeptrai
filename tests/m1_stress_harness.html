<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Milestone 1 Stress Test Harness</title>
</head>
<body>
  <h1>Milestone 1 Stress Test Suite</h1>
  <div id="status">Running...</div>
  <pre id="output"></pre>
  <div id="results-json" style="display:none;"></div>
  <div id="done" style="display:none;">DONE</div>

  <!-- Game Modules -->
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/equipment_data.js"></script>
  <script src="../js/inventory.js"></script>
  <script src="../js/shop.js"></script>
  <script src="../js/dungeon_data_100.js"></script>
  <script src="../js/gamification_quests.js"></script>
  <script src="../js/gamification_skills.js"></script>
  <script src="../js/gamification_pets.js"></script>
  <script src="../js/gamification_tower.js"></script>
  <script src="../js/battle.js"></script>

  <!-- Stress Test Suite -->
  <script src="m1_stress_harness.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      // Run all stress test suites sequentially
      if (typeof window.runMilestone1StressSuites === 'function') {
        await window.runMilestone1StressSuites();
      }

      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('output');
      const jsonEl = document.getElementById('results-json');
      const doneEl = document.getElementById('done');

      const results = window.__M1_STRESS_RESULTS__;
      jsonEl.textContent = JSON.stringify(results, null, 2);

      let summaryText = `Total: ${results.total}, Passed: ${results.passed}, Failed: ${results.failed}\n\n`;
      results.suites.forEach(s => {
        summaryText += `[${s.name}] (${s.passed}/${s.tests.length} passed)\n`;
        s.tests.forEach(t => {
          summaryText += `  ${t.passed ? '✓ [PASS]' : '✗ [FAIL]'} ${t.name} (${t.duration}ms)\n`;
          if (t.error) summaryText += `      Error: ${t.error}\n`;
        });
      });

      if (results.bugsFound && results.bugsFound.length > 0) {
        summaryText += `\n⚠️ BUGS EMPIRICALLY CONFIRMED (${results.bugsFound.length}):\n`;
        results.bugsFound.forEach(b => {
          summaryText += `  • [${b.severity}] ${b.id}: ${b.description}\n    Proof: ${b.empiricalProof}\n`;
        });
      }

      outputEl.textContent = summaryText;
      statusEl.textContent = 'COMPLETED';
      doneEl.style.display = 'block';
    });
  </script>
</body>
</html>
