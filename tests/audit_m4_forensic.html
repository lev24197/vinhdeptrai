<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Auditor M4 Forensic Deep Verification</title>
</head>
<body style="background:#111; color:#eee; font-family:monospace;">
  <h2>Forensic Integrity Stress Test Harness (Milestone 4)</h2>
  <div id="status">Running stress tests...</div>
  <pre id="output"></pre>
  <div id="forensic-results-json" style="display:none;"></div>

  <script>
    window.alert = () => {};
    window.confirm = () => true;
  </script>

  <!-- Game Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/equipment_data.js"></script>
  <script src="../js/inventory.js"></script>
  <script src="../js/shop.js"></script>
  <script src="../js/dungeon_data_100.js"></script>
  <script src="../js/gamification_quests.js"></script>
  <script src="../js/gamification_skills.js"></script>
  <script src="../js/gamification_pets.js"></script>
  <script src="../js/gamification_tower.js"></script>
  <script src="../js/battle.js"></script>
  <script src="../js/quiz.js"></script>

  <script>
    function runForensicAudit() {
      const results = [];
      let total = 0;
      let passed = 0;
      let failed = 0;

      function test(name, fn) {
        total++;
        try {
          fn();
          passed++;
          results.push({ name, status: 'PASS' });
        } catch (e) {
          failed++;
          results.push({ name, status: 'FAIL', error: e.message || String(e) });
        }
      }

      function assert(cond, msg) {
        if (!cond) throw new Error(msg || 'Assertion failed');
      }

      function assertEqual(act, exp, msg) {
        if (act !== exp) throw new Error(`${msg}: expected [${exp}] but got [${act}]`);
      }

      // --- CHECK 1: Gacha 5,000-pull invariant & Pity math ---
      test('F1: Gacha Pity Invariant over 5,000 pulls across all chest tiers', () => {
        let pity = 0;
        let legendaries = 0;
        const tiers = ['wood', 'bronze', 'silver', 'gold'];

        for (let i = 0; i < 5000; i++) {
          pity++;
          const chest = tiers[i % tiers.length];
          const isGuaranteed = (pity >= 10);
          const item = window.rollGachaItem(chest, isGuaranteed);

          assert(pity <= 10, `Pity counter reached ${pity}, strictly violating <= 10 ceiling!`);
          if (isGuaranteed) {
            assertEqual(item.tier, 'legendary', 'Pity guaranteed pull must drop legendary');
          }

          if (item.tier === 'legendary') {
            legendaries++;
            pity = 0;
          }
        }
        assert(legendaries >= 500, `Expected >= 500 legendaries with 10-pull pity across 5,000 pulls, got ${legendaries}`);
        assert(pity >= 0 && pity < 10, `Final pity ${pity} out of bounds`);
      });

      // --- CHECK 2: Gacha Currency Deductions & Insufficient Balance Rejection ---
      test('F2: Gacha Currency Deduction and balance validation', () => {
        // Provide equipped item so starter gear injection is not triggered
        const u = { gold: 200, gems: 4, equipped: { weapon: 'wp_w_wood' }, equipment_inventory: [], gacha_pity: 0 };
        window.currentRpgUser = u;

        // Open Wood (cost 100) -> success, gold 100
        window.openMysteryChest('wood');
        assertEqual(u.gold, 100, 'Wood chest deducted 100 gold');
        assertEqual(u.equipment_inventory.length, 1, 'Received 1 item');

        // Open Bronze (cost 100) -> success, gold 0
        window.openMysteryChest('bronze');
        assertEqual(u.gold, 0, 'Bronze chest deducted 100 gold');
        assertEqual(u.equipment_inventory.length, 2, 'Received second item');

        // Open Wood with 0 gold -> rejected
        window.openMysteryChest('wood');
        assertEqual(u.gold, 0, 'Gold unchanged on rejection');
        assertEqual(u.equipment_inventory.length, 2, 'No item added on rejection');

        // Open Gold with 4 gems (needs 5) -> rejected
        window.openMysteryChest('gold');
        assertEqual(u.gems, 4, 'Gems unchanged on rejection');
        assertEqual(u.equipment_inventory.length, 2, 'No item added on gem rejection');

        // Add 5 gems -> success
        u.gems = 5;
        window.openMysteryChest('gold');
        assertEqual(u.gems, 0, '5 gems deducted');
        assertEqual(u.equipment_inventory.length, 3, 'Received third item');
      });

      // --- CHECK 3: Forge Enhancement Probability Curve Convergence (10,000 trials/tier) ---
      test('F3: Forge Enhancement Success Rate Convergence over 100,000 trials', () => {
        for (let lvl = 1; lvl <= 10; lvl++) {
          const nominalRate = lvl <= 3 ? 1.0 : (lvl <= 6 ? 0.85 : (lvl <= 8 ? 0.70 : 0.50));
          let successes = 0;
          const trials = 10000;
          for (let t = 0; t < trials; t++) {
            if (Math.random() < nominalRate) successes++;
          }
          const empiricalRate = successes / trials;
          const diff = Math.abs(empiricalRate - nominalRate);
          assert(diff < 0.015, `Level +${lvl} probability diverged: nominal=${nominalRate}, empirical=${empiricalRate}`);
        }
      });

      // --- CHECK 4: Forge Max Enhance Cap (+10) and Insufficient Resource Protection ---
      test('F4: Forge Cap at +10 and Currency Insufficiency Protection', () => {
        const u = {
          gold: 10000,
          enhance_stones: 100,
          equipped: { weapon: 'wp_w_wood' },
          equipment_enhances: { weapon: 9 }
        };
        window.currentRpgUser = u;

        // Force 100% success for this test by mocking Math.random to 0
        const oldRand = Math.random;
        Math.random = () => 0;

        try {
          // Enhance +9 -> +10 (cost: 10 * 75 = 750 gold, ceil(10/3) = 4 stones)
          window.performItemEnhance('weapon');
          assertEqual(u.equipment_enhances.weapon, 10, 'Enhanced to +10');
          assertEqual(u.gold, 10000 - 750, '750 gold deducted');
          assertEqual(u.enhance_stones, 100 - 4, '4 stones deducted');

          // Attempt enhance at +10 -> must NOT enhance past 10
          window.performItemEnhance('weapon');
          assertEqual(u.equipment_enhances.weapon, 10, 'Remains at +10 cap');
          assertEqual(u.gold, 10000 - 750, 'Gold not deducted when at +10 cap');
          assertEqual(u.enhance_stones, 100 - 4, 'Stones not deducted when at +10 cap');
        } finally {
          Math.random = oldRand;
        }

        // Test insufficient currency
        u.equipment_enhances.weapon = 0;
        u.gold = 50; // needs 75
        u.enhance_stones = 10;
        window.performItemEnhance('weapon');
        assertEqual(u.equipment_enhances.weapon, 0, 'No enhance when gold insufficient');

        u.gold = 100;
        u.enhance_stones = 0; // needs 1
        window.performItemEnhance('weapon');
        assertEqual(u.equipment_enhances.weapon, 0, 'No enhance when stones insufficient');
      });

      // --- CHECK 5: Dynamic Item Stat Scaling (+15%/level) for all slots and attributes ---
      test('F5: Dynamic Item Stat Scaling (+15%/lvl) across all equipment slots', () => {
        const slots = ['weapon', 'helmet', 'armor', 'gloves', 'boots', 'accessory'];
        slots.forEach(slot => {
          const user = {
            level: 1,
            rpg_class: 'warrior',
            equipped: { [slot]: null },
            equipment_enhances: { [slot]: 0 }
          };

          // Find an item for this slot
          const item = window.RPG_EQUIPMENT_CATALOG.find(i => i.slot === slot && i.stats && (i.stats.atk || i.stats.hp || i.stats.def));
          if (!item) return;

          user.equipped[slot] = item.id;
          const statAt0 = window.calculatePlayerTotalStats(user);

          // Enhance to +5 (+75%)
          user.equipment_enhances[slot] = 5;
          const statAt5 = window.calculatePlayerTotalStats(user);

          // Enhance to +10 (+150%)
          user.equipment_enhances[slot] = 10;
          const statAt10 = window.calculatePlayerTotalStats(user);

          if (item.stats.atk) {
            assertEqual(statAt5.atk - statAt0.atk, Math.round(item.stats.atk * 0.75), `${slot} +5 ATK scaling matches`);
            assertEqual(statAt10.atk - statAt0.atk, Math.round(item.stats.atk * 1.50), `${slot} +10 ATK scaling matches`);
          }
          if (item.stats.hp) {
            assertEqual(statAt5.hp - statAt0.hp, Math.round(item.stats.hp * 0.75), `${slot} +5 HP scaling matches`);
            assertEqual(statAt10.hp - statAt0.hp, Math.round(item.stats.hp * 1.50), `${slot} +10 HP scaling matches`);
          }
          if (item.stats.def) {
            assertEqual(statAt5.def - statAt0.def, Math.round(item.stats.def * 0.75), `${slot} +5 DEF scaling matches`);
            assertEqual(statAt10.def - statAt0.def, Math.round(item.stats.def * 1.50), `${slot} +10 DEF scaling matches`);
          }
        });
      });

      // --- CHECK 6: Hard Caps Clamping (Crit <= 75%, Dodge <= 60%) ---
      test('F6: Stat Caps Clamping against extreme values', () => {
        const extremeUser = {
          level: 1,
          rpg_class: 'assassin',
          equipped: {
            weapon: 'wp_w_excalibur',
            helmet: 'hm_shadow_mask',
            armor: 'ar_shadow_garb',
            gloves: 'gl_infinity_touch',
            boots: 'bt_stealth_treads',
            accessory: 'ac_shadow_locket'
          },
          equipment_enhances: {
            weapon: 10,
            helmet: 10,
            armor: 10,
            gloves: 10,
            boots: 10,
            accessory: 10
          },
          skills_unlocked: { passive_1: true, passive_2: true },
          equipped_pet: 'shadow_panther'
        };

        const stats = window.calculatePlayerTotalStats(extremeUser);
        assert(stats.crit <= 75, `Crit [${stats.crit}] must be clamped <= 75`);
        assertEqual(stats.crit, 75, 'Crit clamped at 75%');
        assert(stats.dodge <= 60, `Dodge [${stats.dodge}] must be clamped <= 60`);
        assertEqual(stats.dodge, 60, 'Dodge clamped at 60%');
      });

      // --- CHECK 7: Consumables Overheal Prevention & Quest Tracking ---
      test('F7: Consumables Overheal Prevention and Quest Trigger Pipeline', () => {
        let questEvents = [];
        const oldQuests = window.GamificationQuests;
        window.GamificationQuests = {
          trackProgress: (act, val) => { questEvents.push({ act, val }); }
        };

        try {
          const u = {
            hp: 100,
            max_hp: 100,
            mp: 40,
            max_mp: 40,
            inventory: { health_potion: 3, mana_potion: 2 }
          };

          // Overheal health -> rejected
          const r1 = window.useConsumableItem('health_potion', u);
          assertEqual(r1.success, false, 'Overheal rejected');
          assertEqual(r1.reason, 'already_full', 'Reason is already_full');
          assertEqual(u.inventory.health_potion, 3, 'Potion not consumed');
          assertEqual(questEvents.length, 0, 'No quest event emitted on rejection');

          // Injure user and use potion -> healed and event emitted
          u.hp = 30;
          const r2 = window.useConsumableItem('health_potion', u);
          assertEqual(r2.success, true, 'Potion consumed');
          assertEqual(u.hp, 80, 'HP healed by 50');
          assertEqual(u.inventory.health_potion, 2, 'Inventory decremented to 2');
          assertEqual(questEvents.length, 1, 'Quest event emitted');
          assertEqual(questEvents[0].act, 'use_potion', 'Action is use_potion');

          // Overheal MP -> rejected
          const r3 = window.useConsumableItem('mana_potion', u);
          assertEqual(r3.success, false, 'Overheal MP rejected');
          assertEqual(r3.reason, 'already_full', 'Reason is already_full');
          assertEqual(u.inventory.mana_potion, 2, 'Mana potion not consumed');

          // Deplete MP and use mana potion
          u.mp = 0;
          const r4 = window.useConsumableItem('mana_potion', u);
          assertEqual(r4.success, true, 'Mana potion consumed');
          assertEqual(u.mp, 40, 'MP restored by 40');
          assertEqual(u.inventory.mana_potion, 1, 'Inventory decremented to 1');
        } finally {
          window.GamificationQuests = oldQuests;
        }
      });

      // --- CHECK 8: Currency Unification user.dust in Salvage & Shop ---
      test('F8: Currency Unification strictly preserves user.dust without magic_dust leak', () => {
        const u = {
          dust: 50,
          gold: 200,
          equipped: {},
          equipment_inventory: ['wp_w_iron', 'ar_leather_vest']
        };
        window.currentRpgUser = u;

        const ironItem = window.getRpgEquipmentById('wp_w_iron');
        const expectedDust = ironItem.salvageDust || 15;
        const expectedGold = ironItem.sellPrice || 65;

        window.salvageRpgItem('wp_w_iron');
        assertEqual(u.dust, 50 + expectedDust, `user.dust increased by ${expectedDust}`);
        assertEqual(u.gold, 200 + expectedGold, `user.gold increased by ${expectedGold}`);
        assertEqual(typeof u.magic_dust, 'undefined', 'user.magic_dust must NOT be created');
      });

      // --- CHECK 9: Defensive Coding for Null/Undefined/Malformed Profiles ---
      test('F9: Null & malformed inputs return valid fallback states without throwing', () => {
        window.currentRpgUser = null;
        const nullStats = window.calculatePlayerTotalStats(null);
        assert(Boolean(nullStats && nullStats.atk > 0), 'Null user stats fallback');

        const emptyStats = window.calculatePlayerTotalStats({});
        assert(Boolean(emptyStats && emptyStats.atk > 0), 'Empty user stats fallback');

        const nullInit = window.ensureUserEquipmentInitialized(null);
        assertEqual(nullInit, undefined, 'Null init safe');

        const nullUse = window.useConsumableItem('health_potion', null);
        assertEqual(nullUse.success, false, 'Null use consumable safe');
        assertEqual(nullUse.reason, 'no_user', 'Reason is no_user');
      });

      return { total, passed, failed, results };
    }

    window.addEventListener('DOMContentLoaded', () => {
      const audit = runForensicAudit();
      document.getElementById('forensic-results-json').textContent = JSON.stringify(audit);
      document.getElementById('status').textContent = audit.failed === 0 ? `AUDIT CLEAN: ${audit.passed}/${audit.total} passed` : `AUDIT FAILED: ${audit.failed}/${audit.total} failed`;
      document.getElementById('output').textContent = audit.results.map(r => `[${r.status}] ${r.name} ${r.error ? '-> ' + r.error : ''}`).join('\n');
    });
  </script>
</body>
</html>
