<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>M2 Verification Test Harness</title>
  <script src="../js/gamification_skills.js"></script>
  <script src="../js/gamification_pets.js"></script>
  <script src="../js/gamification_tower.js"></script>
</head>
<body>
  <h1>Milestone 2 Verification Test Suite</h1>
  <div id="results"></div>
  <script id="test-output-json" type="application/json"></script>

  <script>
    (function() {
      // Mock alert and confirm for headless testing
      window.alert = function() {};
      window.confirm = function() { return true; };

      const results = {
        total: 0,
        passed: 0,
        failed: 0,
        tests: []
      };

      function test(name, fn) {
        results.total++;
        try {
          fn();
          results.passed++;
          results.tests.push({ name, passed: true });
        } catch (err) {
          results.failed++;
          results.tests.push({ name, passed: false, error: err.message || String(err) });
        }
      }

      function assert(condition, msg) {
        if (!condition) throw new Error(msg || 'Assertion failed');
      }

      function assertEqual(actual, expected, msg) {
        if (actual !== expected) throw new Error(`${msg}: expected ${expected}, got ${actual}`);
      }

      // =========================================================================
      // SUITE 1: 4 Character Classes & Skill Parameters
      // =========================================================================
      test('M2.1: 4 Classes exist in GamificationSkills', () => {
        assert(Boolean(window.GamificationSkills), 'GamificationSkills must be defined');
        const classes = ['warrior', 'mage', 'ranger', 'assassin'];
        classes.forEach(cls => {
          assert(Boolean(GamificationSkills.CLASS_SKILLS[cls]), `Class ${cls} must exist`);
        });
      });

      test('M2.2: Warrior skills and execution parameters', () => {
        const w = GamificationSkills.CLASS_SKILLS.warrior;
        assertEqual(w.active_1.dmgMult, 2.2, 'Warrior Active 1 dmgMult must be 2.2');
        assertEqual(w.active_2.mitigation, 0.8, 'Warrior Active 2 mitigation must be 0.8');
        assertEqual(w.active_2.reflect, 1.0, 'Warrior Active 2 reflect must be 1.0');
        assertEqual(w.passive_1.bonusDef, 15, 'Warrior Passive 1 bonusDef must be 15');
        assertEqual(w.passive_1.bonusMaxHp, 30, 'Warrior Passive 1 bonusMaxHp must be 30');
        assertEqual(w.passive_2.surviveWithHp, 1, 'Warrior Passive 2 surviveWithHp must be 1');
      });

      test('M2.3: Mage skills and execution parameters', () => {
        const m = GamificationSkills.CLASS_SKILLS.mage;
        assertEqual(m.active_1.freezeTurns, 1, 'Mage Active 1 freezeTurns must be 1');
        assertEqual(m.active_2.dmgMult, 3.0, 'Mage Active 2 dmgMult must be 3.0');
        assertEqual(m.active_2.ignoreDefPercent, 0.5, 'Mage Active 2 ignoreDefPercent must be 0.5');
        assertEqual(m.passive_1.bonusMpOnCorrect, 15, 'Mage Passive 1 bonusMpOnCorrect must be 15');
        assertEqual(m.passive_2.bonusMaxMp, 25, 'Mage Passive 2 bonusMaxMp must be 25');
      });

      test('M2.4: Ranger skills and execution parameters', () => {
        const r = GamificationSkills.CLASS_SKILLS.ranger;
        assertEqual(r.active_1.eliminateCount, 2, 'Ranger Active 1 eliminateCount must be 2');
        assertEqual(r.active_2.hits, 2, 'Ranger Active 2 hits must be 2');
        assertEqual(r.active_2.multPerHit, 1.1, 'Ranger Active 2 multPerHit must be 1.1');
        assertEqual(r.active_2.ignoreDefPercent, 0.4, 'Ranger Active 2 ignoreDefPercent must be 0.4');
        assertEqual(r.passive_1.bonusCrit, 15, 'Ranger Passive 1 bonusCrit must be 15');
        assertEqual(r.passive_2.bonusGoldPercent, 0.30, 'Ranger Passive 2 bonusGoldPercent must be 0.30');
      });

      test('M2.5: Assassin skills and execution parameters', () => {
        const a = GamificationSkills.CLASS_SKILLS.assassin;
        assertEqual(a.active_1.dodgeRate, 1.0, 'Assassin Active 1 dodgeRate must be 1.0');
        assertEqual(a.active_2.critMult, 3.5, 'Assassin Active 2 critMult must be 3.5');
        assertEqual(a.active_2.guaranteedCrit, true, 'Assassin Active 2 guaranteedCrit must be true');
        assertEqual(a.passive_1.poisonDmg, 25, 'Assassin Passive 1 poisonDmg must be 25');
        assertEqual(a.passive_1.poisonTurns, 3, 'Assassin Passive 1 poisonTurns must be 3');
        assertEqual(a.passive_2.bonusDodge, 15, 'Assassin Passive 2 bonusDodge must be 15');

        const poison = GamificationSkills.getAssassinPoisonParams();
        assertEqual(poison.poisonDmg, 25, 'getAssassinPoisonParams poisonDmg');
        assertEqual(poison.poisonTurns, 3, 'getAssassinPoisonParams poisonTurns');
      });

      test('M2.6: SP Accrual, Skill Unlocking, Reset SP, and Class Switching', () => {
        const user = { level: 5, rpg_class: 'warrior' };
        GamificationSkills.ensureInitialized(user);
        assertEqual(user.skill_points, 4, 'Level 5 user has 4 SP');
        assertEqual(user.skills_unlocked.active_1, true, 'active_1 unlocked initially');
        assertEqual(user.skills_unlocked.active_2, false, 'active_2 locked initially');

        window.currentRpgUser = user;
        GamificationSkills.unlockSkill('active_2');
        assertEqual(user.skill_points, 3, 'SP decremented to 3');
        assertEqual(user.skills_unlocked.active_2, true, 'active_2 unlocked');

        // Reset skills
        GamificationSkills.resetSkills(true);
        assertEqual(user.skill_points, 4, 'Reset SP refunded all 4 points');
        assertEqual(user.skills_unlocked.active_2, false, 'active_2 locked after reset');

        // Switch class
        GamificationSkills.selectClass('mage');
        assertEqual(user.rpg_class, 'mage', 'Class switched to mage');
      });

      // =========================================================================
      // SUITE 2: 4 Companion Pets, Legacy Aliases, Feeding & Monotonic Scaling
      // =========================================================================
      test('M2.7: 4 Canonical Pets & Non-enumerable Legacy Aliases', () => {
        assert(Boolean(window.GamificationPets), 'GamificationPets must be defined');
        const keys = Object.keys(GamificationPets.PETS_DATA);
        assertEqual(keys.length, 4, 'Object.keys(PETS_DATA) must be exactly 4');
        assert(keys.includes('wise_owl'), 'wise_owl in keys');
        assert(keys.includes('baby_drake'), 'baby_drake in keys');
        assert(keys.includes('golden_shiba'), 'golden_shiba in keys');
        assert(keys.includes('shadow_panther'), 'shadow_panther in keys');

        // Legacy aliases must be accessible
        assertEqual(GamificationPets.PETS_DATA.fortune_cat.id, 'golden_shiba', 'fortune_cat aliases to golden_shiba');
        assertEqual(GamificationPets.PETS_DATA.frost_kitsune.id, 'shadow_panther', 'frost_kitsune aliases to shadow_panther');
      });

      test('M2.8: Monotonic Buff Scaling Across Levels 1 to 10 for All Pets', () => {
        const pets = ['wise_owl', 'baby_drake', 'golden_shiba', 'shadow_panther'];
        pets.forEach(pId => {
          let prevBuffs = null;
          for (let lvl = 1; lvl <= 10; lvl++) {
            const b = GamificationPets.getPetBuffs(pId, lvl, 50);
            if (prevBuffs) {
              if (pId === 'wise_owl') {
                assert(b.expMultiplier > prevBuffs.expMultiplier, `Wise Owl EXP strictly monotonic at Lv${lvl}`);
                assert(b.studyHintChance > prevBuffs.studyHintChance, `Wise Owl Hint strictly monotonic at Lv${lvl}`);
              } else if (pId === 'baby_drake') {
                assert(b.assistDmg > prevBuffs.assistDmg, `Baby Drake Assist DMG strictly monotonic at Lv${lvl}`);
                assert(b.burnDmg > prevBuffs.burnDmg, `Baby Drake Burn DoT strictly monotonic at Lv${lvl}`);
              } else if (pId === 'golden_shiba') {
                assert(b.goldMultiplier > prevBuffs.goldMultiplier, `Golden Shiba Gold strictly monotonic at Lv${lvl}`);
                assert(b.critBonus > prevBuffs.critBonus, `Golden Shiba Crit strictly monotonic at Lv${lvl}`);
              } else if (pId === 'shadow_panther') {
                assert(b.dodgeBonus > prevBuffs.dodgeBonus, `Shadow Panther Dodge strictly monotonic at Lv${lvl}`);
                assert(b.shadowStrikeDmg > prevBuffs.shadowStrikeDmg, `Shadow Panther Strike strictly monotonic at Lv${lvl}`);
              }
            }
            prevBuffs = b;
          }
        });
      });

      test('M2.9: Pet Feeding System & Well-Fed Buff', () => {
        assert(Boolean(GamificationPets.FOOD_ITEMS), 'FOOD_ITEMS defined');
        const foodKeys = Object.keys(GamificationPets.FOOD_ITEMS);
        assert(foodKeys.length >= 4, 'At least 4 food items defined');

        const user = {
          gold: 200,
          dust: 50,
          pets: {
            wise_owl: { unlocked: true, level: 1, affinity: 40 }
          }
        };
        window.currentRpgUser = user;
        GamificationPets.ensureInitialized(user);

        // Feed snack_apple (+15 affinity, cost 30 gold)
        const res1 = GamificationPets.feedPet('wise_owl', 'snack_apple');
        assert(res1.success, 'feedPet succeeds');
        assertEqual(user.pets.wise_owl.affinity, 55, 'Affinity increased to 55');
        assertEqual(user.gold, 170, 'Gold deducted to 170');
        assertEqual(res1.isWellFed, false, 'Not well-fed at affinity 55');

        // Feed snack_fish (+25 affinity, cost 50 gold, 5 dust) -> affinity reaches 80 (Well-Fed!)
        const res2 = GamificationPets.feedPet('wise_owl', 'snack_fish');
        assert(res2.success, 'feedPet succeeds');
        assertEqual(user.pets.wise_owl.affinity, 80, 'Affinity reaches 80');
        assertEqual(res2.isWellFed, true, 'Well-fed triggered at affinity >= 70');
        assertEqual(user.gold, 120, 'Gold deducted to 120');
        assertEqual(user.dust, 45, 'Dust deducted to 45');

        // Check buff has wellFedBonus
        const buffs = GamificationPets.getPetBuffs('wise_owl', 1, user.pets.wise_owl.affinity);
        assert(buffs.isWellFed === true, 'isWellFed flag true');
        assert(Boolean(buffs.wellFedBonus), 'wellFedBonus exists');
        assertEqual(buffs.wellFedBonus.allStatsPercent, 10, '+10% all stats on well-fed');
      });

      test('M2.10: Pet Upgrading (Level 1..10) consuming Gold and unified user.dust', () => {
        const user = {
          gold: 500,
          dust: 200,
          pets: {
            golden_shiba: { unlocked: true, level: 1, affinity: 50 }
          }
        };
        window.currentRpgUser = user;
        GamificationPets.ensureInitialized(user);

        // Upgrade Level 1 -> 2: Gold cost = 50 + 1*30 = 80; Dust cost = 20 + 1*15 = 35
        const upRes = GamificationPets.upgradePet('golden_shiba');
        assert(upRes === true, 'upgradePet succeeds');
        assertEqual(user.pets.golden_shiba.level, 2, 'Level increments to 2');
        assertEqual(user.gold, 420, 'Gold deducted to 420');
        assertEqual(user.dust, 165, 'Dust deducted to 165');
        assertEqual(user.magic_dust, 165, 'Legacy magic_dust synchronized');
      });

      // =========================================================================
      // SUITE 3: Tower of Babel 50+ Floors, 10+ Modifiers & Boss Rush
      // =========================================================================
      test('M2.11: 10+ Floor Boss Modifiers defined with execution params', () => {
        assert(Boolean(window.GamificationTower), 'GamificationTower must be defined');
        assert(Array.isArray(GamificationTower.FLOOR_MODIFIERS), 'FLOOR_MODIFIERS must be an array');
        assert(GamificationTower.FLOOR_MODIFIERS.length >= 10, 'FLOOR_MODIFIERS must have >= 10 modifiers');

        const required = [
          'iron_reflect', 'flame_aura', 'divine_shield', 'vampiric_bite', 'speed_blitz',
          'armor_pierce', 'toxic_cloud', 'storm_surge', 'frost_chill', 'cosmic_surge'
        ];

        required.forEach(reqId => {
          const mod = GamificationTower.FLOOR_MODIFIERS.find(m => m.id === reqId);
          assert(Boolean(mod), `Modifier ${reqId} must exist`);
          assert(Boolean(mod.name), `Modifier ${reqId} must have name`);
          assert(Boolean(mod.icon), `Modifier ${reqId} must have icon`);
          assert(Boolean(mod.desc), `Modifier ${reqId} must have desc`);
        });

        // Test modifier sampling for floors 1 to 50
        for (let fl = 1; fl <= 50; fl++) {
          const mod = GamificationTower.getFloorModifier(fl);
          assert(Boolean(mod), `Floor ${fl} resolves to a valid modifier`);
        }
      });

      test('M2.12: Floor Stat Scaling and Elite Boss Floor Flag', () => {
        window.BattleEngine = {
          monster: { maxHp: 100, hp: 100, atk: 25, def: 10 },
          updateBattleUI: function() {},
          triggerBossAlert: function() {}
        };

        // Floor 1 (multiplier 1.0)
        GamificationTower.scaleMonsterForTower(1);
        assertEqual(BattleEngine.monster.maxHp, 100, 'Floor 1 HP is 100');
        assertEqual(BattleEngine.monster.atk, 25, 'Floor 1 ATK is 25');

        // Floor 5 (multiplier 1 + 4 * 0.12 = 1.48, Elite Boss Floor)
        GamificationTower.scaleMonsterForTower(5);
        assertEqual(BattleEngine.monster.maxHp, 148, 'Floor 5 HP is 148');
        assertEqual(BattleEngine.monster.atk, 37, 'Floor 5 ATK is 37');
        assertEqual(BattleEngine.monster.isBoss, true, 'Floor 5 is an Elite Boss Floor');

        // Floor 50 (multiplier 1 + 49 * 0.12 = 6.88, Elite Boss Floor)
        GamificationTower.scaleMonsterForTower(50);
        assertEqual(BattleEngine.monster.maxHp, 688, 'Floor 50 HP is 688');
        assertEqual(BattleEngine.monster.atk, 172, 'Floor 50 ATK is 172');
        assertEqual(BattleEngine.monster.isBoss, true, 'Floor 50 is an Elite Boss Floor');
      });

      test('M2.13: Floor Clear Economic Rewards (Gold, EXP, Stones, Gems)', () => {
        // Floor 5 rewards: Gold = 90, EXP = 125, Enhance Stones = 1, Gems = 0
        const r5 = GamificationTower.calculateFloorReward(5);
        assertEqual(r5.gold, 90, 'Floor 5 gold is 90');
        assertEqual(r5.exp, 125, 'Floor 5 EXP is 125');
        assertEqual(r5.enhanceStones, 1, 'Floor 5 enhanceStones is 1');
        assertEqual(r5.gems, 0, 'Floor 5 gems is 0');

        // Floor 10 rewards: Gold = 150, EXP = 250, Enhance Stones = 2, Gems = 2
        const r10 = GamificationTower.calculateFloorReward(10);
        assertEqual(r10.gold, 150, 'Floor 10 gold is 150');
        assertEqual(r10.exp, 250, 'Floor 10 EXP is 250');
        assertEqual(r10.enhanceStones, 2, 'Floor 10 enhanceStones is 2');
        assertEqual(r10.gems, 2, 'Floor 10 gems is 2');

        // Floor 50 rewards: Gold = 750, EXP = 1250, Enhance Stones = 10, Gems = 10
        const r50 = GamificationTower.calculateFloorReward(50);
        assertEqual(r50.gold, 750, 'Floor 50 gold is 750');
        assertEqual(r50.exp, 1250, 'Floor 50 EXP is 1250');
        assertEqual(r50.enhanceStones, 10, 'Floor 50 enhanceStones is 10');
        assertEqual(r50.gems, 10, 'Floor 50 gems is 10');
      });

      test('M2.14: Boss Rush Mode 5-Boss Gauntlet Runner & State Tracking', () => {
        assert(Boolean(GamificationTower.bossRushState), 'bossRushState exists');
        assertEqual(GamificationTower.bossRushState.totalBosses, 5, 'Total bosses in Boss Rush is 5');

        const user = { gold: 0, gems: 0, enhance_stones: 0 };
        window.currentRpgUser = user;
        GamificationTower.ensureInitialized(user);

        // Start Boss Rush
        GamificationTower.bossRushState.currentBossIdx = 1;
        GamificationTower.bossRushState.preservedHeroHp = null;

        // Clear Boss 1 through 4
        for (let b = 1; b <= 4; b++) {
          window.BattleEngine = { hero: { hp: 100 - b * 10 } };
          GamificationTower.onBossRushCleared();
          assertEqual(GamificationTower.bossRushState.currentBossIdx, b + 1, `Advances to Boss ${b + 1}`);
          assertEqual(GamificationTower.bossRushState.preservedHeroHp, 100 - b * 10, 'Hero HP preserved between battles');
        }

        // Clear Boss 5 (Gauntlet Victory!)
        GamificationTower.onBossRushCleared();
        assertEqual(user.tower_records.boss_rush_wins, 1, 'boss_rush_wins incremented to 1');
        assertEqual(user.gold, 500, 'Gold reward +500 awarded on 5/5 clear');
        assertEqual(user.gems, 10, 'Gems reward +10 awarded on 5/5 clear');
        assertEqual(user.enhance_stones, 5, 'Enhance stones +5 awarded on 5/5 clear');
      });

      // Output results
      const jsonEl = document.getElementById('test-output-json');
      jsonEl.textContent = JSON.stringify(results, null, 2);

      const div = document.getElementById('results');
      div.innerHTML = `<h2>Passed: ${results.passed}/${results.total} (${results.failed === 0 ? 'SUCCESS' : 'FAILED'})</h2>`;
    })();
  </script>
</body>
</html>
