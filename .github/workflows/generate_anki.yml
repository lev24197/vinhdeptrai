name: Auto Generate Anki Topics

on:
  schedule:
    # Tự động chạy 4 khung giờ Việt Nam (UTC+7) mỗi ngày:
    # 09:00 Sáng VN -> 02:00 UTC
    # 12:00 Trưa VN  -> 05:00 UTC
    # 15:00 Chiều VN -> 08:00 UTC (3h chiều)
    # 18:00 Chiều VN -> 11:00 UTC (6h chiều)
    # Mỗi đợt tạo 3 chủ đề -> 4 đợt x 3 = 12 chủ đề / ngày
    - cron: '0 2,5,8,11 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Số lượng chủ đề muốn tạo'
        required: false
        default: '3'
      target_stt:
        description: 'STT chủ đề cụ thể muốn tạo (để trống nếu muốn tạo tự động theo thứ tự)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Anki Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '3' }}
          TARGET_STT: ${{ github.event.inputs.target_stt || '' }}
        run: python generate.py

      - name: Commit and Push generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/ status.json
          git diff --staged --quiet || git commit -m "Auto-update Anki files and status.json"
          git push
